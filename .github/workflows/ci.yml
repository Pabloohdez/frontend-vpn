name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck (svelte-check)
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          SESSION_SECRET: ci_dummy_secret_minimum_32_chars_long
          ADMIN_PASSWORD: ci_admin
